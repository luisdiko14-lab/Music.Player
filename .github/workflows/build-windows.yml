name: Build Windows Player

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile music_player.py pywebview_gui.py
          node --check web/app.js

      - name: Build executable
        shell: pwsh
        run: |
          python -m pip install --upgrade -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name MusicPlayer --collect-all webview --collect-all pystray --collect-all PIL --collect-all certifi --add-data "web;web" music_player.py

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/music | Out-Null
          Copy-Item dist/MusicPlayer.exe package/MusicPlayer.exe
          Set-Content -Path package/music/README.txt -Value "Place your audio and video files in this folder. The player scans it when it starts."
          Compress-Archive -Path package/* -DestinationPath music-player-windows.zip -Force
          New-Item -ItemType Directory -Force builds | Out-Null
          Copy-Item music-player-windows.zip builds/music-player-windows.zip -Force

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-player-windows
          path: music-player-windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit package to selected branch
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/music-player-windows.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The packaged executable is already up to date."
            exit 0
          }
          git commit -m "build: update Windows player package"
          git push origin "HEAD:$env:TARGET_BRANCH"